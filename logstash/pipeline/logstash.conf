input {
  # File-based input (existing)
  file {
    path => "/data/uploads/*.csv"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => plain
    type => "csv"
  }
  
  file {
    path => "/data/uploads/*.json"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json
    type => "json"
  }
  
  # TCP input for real-time streaming
  tcp {
    port => 5000
    codec => json_lines
    type => "tcp_stream"
  }
  
  # UDP input for lightweight streaming
  udp {
    port => 5001
    codec => json
    type => "udp_stream"
  }
  
  # HTTP webhook input
  http {
    port => 8080
    codec => json
    type => "http_webhook"
    response_headers => {
      "Content-Type" => "application/json"
    }
  }
  
  # Redis input for pub/sub streaming
  redis {
    host => "redis"
    port => 6379
    data_type => "list"
    key => "logstash"
    codec => json
    type => "redis_stream"
  }
  
  # Beats input for Filebeat integration
  beats {
    port => 5044
    type => "filebeat"
  }
}

filter {
  # Handle streaming inputs (TCP, UDP, HTTP, Redis, Beats)
  if [type] in ["tcp_stream", "udp_stream", "http_webhook", "redis_stream", "filebeat"] {
    # Parse timestamp if exists
    if [timestamp] {
      date {
        match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd'T'HH:mm:ss'Z'"]
        target => "@timestamp"
      }
    }
    
    # Convert numeric fields if they exist
    if [status_code] {
      mutate {
        convert => { "status_code" => "integer" }
      }
    }
    
    if [response_time_ms] {
      mutate {
        convert => { "response_time_ms" => "float" }
      }
    }
    
    if [query_duration_ms] {
      mutate {
        convert => { "query_duration_ms" => "float" }
      }
    }
    
    # Add GeoIP for client IP
    if [client_ip] {
      geoip {
        source => "client_ip"
        target => "geoip"
      }
    }
    
    # Mark as real-time stream
    mutate {
      add_field => { "realtime" => "true" }
    }
  }
  
  if [type] == "csv" {
    # Skip header line
    if [message] =~ /^timestamp,log_type/ {
      drop { }
    }
    
    csv {
      separator => ","
      columns => [
        "timestamp",
        "log_type",
        "level",
        "client_ip",
        "user_id",
        "method",
        "endpoint",
        "status_code",
        "response_time_ms",
        "user_agent",
        "message",
        "sql_query",
        "query_duration_ms",
        "server",
        "tenant_id"
      ]
      skip_empty_columns => true
    }
    
    # Parse timestamp
    date {
      match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd'T'HH:mm:ss'Z'"]
      target => "@timestamp"
    }
    
    # Convert numeric fields
    mutate {
      convert => {
        "status_code" => "integer"
        "response_time_ms" => "float"
        "query_duration_ms" => "float"
      }
    }
    
    # Add GeoIP for client IP
    if [client_ip] {
      geoip {
        source => "client_ip"
        target => "geoip"
      }
    }
    
    # Remove the raw message field
    mutate {
      remove_field => ["message", "host", "path"]
    }
  }
  
  if [type] == "json" {
    # Parse timestamp if exists
    if [timestamp] {
      date {
        match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd'T'HH:mm:ss'Z'"]
        target => "@timestamp"
      }
    }
    
    # Convert numeric fields if they exist
    if [status_code] {
      mutate {
        convert => { "status_code" => "integer" }
      }
    }
    
    if [response_time_ms] {
      mutate {
        convert => { "response_time_ms" => "float" }
      }
    }
    
    if [query_duration_ms] {
      mutate {
        convert => { "query_duration_ms" => "float" }
      }
    }
    
    # Add GeoIP for client IP
    if [client_ip] {
      geoip {
        source => "client_ip"
        target => "geoip"
      }
    }
  }
  
  # Add common fields
  mutate {
    add_field => {
      "[@metadata][index_prefix]" => "saas-logs"
      "data_source" => "%{type}"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "saas-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }
  
  # Output to Redis for real-time consumers (Flask app)
  redis {
    host => "redis"
    port => 6379
    data_type => "channel"
    key => "logs"
    codec => json
  }
  
  # Uncomment for debugging
  # stdout {
  #   codec => rubydebug
  # }
}
